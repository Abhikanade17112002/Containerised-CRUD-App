spring:
  application:
    name: Containeraized-CRUD-APP

  datasource:
    url: jdbc:postgresql://localhost:5432/studentdb
    username: postgres
    password: your_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080